<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebProfit Animation</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/character.css">
    <link rel="stylesheet" href="css/briefcase.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

<main id="scene">

    <div class="background"></div>

    <section class="stage">

        <!-- PERSONNAGE -->
        
   <div id="character">
    <div id="character-animation"></div>
</div>

        <!-- MALLETTE -->
        <div id="briefcase">

            <div class="briefcase-top"></div>

            <div class="briefcase-bottom"></div>

            <div class="briefcase-handle"></div>

        </div>

        <!-- FORMULAIRE -->
        <section id="register-container">

            <div class="register-card">

                <h2>Créer votre compte</h2>

                <p>
                    Bienvenue sur WebProfit AI.<br>
                    Commencez votre expérience.
                </p>

                <input type="text" placeholder="Nom complet">

                <input type="email" placeholder="Adresse email">

                <input type="password" placeholder="Mot de passe">

                <button>S'inscrire</button>

            </div>

        </section>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>

</body>

</html>
